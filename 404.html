    <!-- SCRIPT ENGINE -->
    <script>
        async function loadAboutMe() {
            try {
                const response = await fetch('aboutme.txt');
                const text = await response.text();
                const lines = text.trim().split('\n');

                lines.forEach(line => {
                    if(!line.trim() || line.trim().startsWith('#')) return;
                    const parts = line.split('|').map(s => s.trim());
                    const key = parts[0];
                    const val = parts[1];

                    if (key === 'hp') {
                        const cleanHp = val.replace(/[^0-9]/g, '');
                        const waNumber = cleanHp.startsWith('0') ? '62' + cleanHp.slice(1) : cleanHp;
                        const waEl = document.getElementById('footerWaLink');
                        if (waEl) waEl.href = `https://wa.me/${waNumber}`;
                    } else if (key === 'email') {
                        const emailEl = document.getElementById('footerEmailLink');
                        if (emailEl) emailEl.href = `mailto:${val}`;
                    }
                });
            } catch (error) {
                console.error("Gagal memuat aboutme.txt", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadAboutMe();
        });
    </script>
